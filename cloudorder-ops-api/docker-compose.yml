services:
  cloudorder-ops-api:
    build: .
    image: cloudorder-ops-api:1.0.0
    container_name: cloudorder-ops-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - onyx
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  onyx:
    name: onyx_default
    external: true

