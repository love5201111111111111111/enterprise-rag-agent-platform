name: Deploy CloudOrder Ops API

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudorder-ops-api-production
  cancel-in-progress: false

jobs:
  validate-confirmation:
    runs-on: ubuntu-22.04
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirmation != 'DEPLOY' }}
        run: |
          echo "Deployment confirmation did not match DEPLOY."
          exit 1

  deploy:
    name: Deploy with health check and rollback
    runs-on: ubuntu-22.04
    needs: validate-confirmation
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run pre-deployment tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --disable-pip-version-check -r cloudorder-ops-api/requirements-dev.txt
          (cd cloudorder-ops-api && python -m pytest tests -q)
          python scripts/validate_project.py

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar --create --gzip --file cloudorder-ops-api.tgz cloudorder-ops-api

      - name: Upload release and deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp cloudorder-ops-api.tgz scripts/deploy_cloudorder_ops_api.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/deploy_cloudorder_ops_api.sh \
              --archive /tmp/cloudorder-ops-api.tgz \
              --target /home/$DEPLOY_USER/cloudorder-ops-api \
              --revision $GITHUB_SHA"
