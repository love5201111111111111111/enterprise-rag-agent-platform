name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Test and validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloudorder-ops-api/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r cloudorder-ops-api/requirements-dev.txt

      - name: Run API unit tests
        working-directory: cloudorder-ops-api
        run: python -m pytest tests -q

      - name: Compile Python sources
        run: |
          python -m compileall -q cloudorder-ops-api/app
          python -m py_compile enterprise-rag-dataset/evaluation/runner/run_eval.py
          python -m py_compile enterprise-rag-dataset/evaluation/runner/run_retrieval_eval.py
          python -m py_compile enterprise-rag-dataset/evaluation/runner/run_load_test.py

      - name: Validate datasets, security, and container policy
        run: python scripts/validate_project.py

  container-smoke-test:
    name: Container build and smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: test-and-validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag cloudorder-ops-api:ci cloudorder-ops-api

      - name: Start container
        run: |
          docker run --detach --rm \
            --name cloudorder-ops-api-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env CLOUDORDER_OPS_API_KEY=ci-test-key \
            --publish 127.0.0.1:18080:8080 \
            cloudorder-ops-api:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs cloudorder-ops-api-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop cloudorder-ops-api-ci || true
